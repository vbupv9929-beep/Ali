<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لِإيما</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div id="floaters"></div>
</div>

<main id="app">

  <!-- الصفحة الأولى -->
  <section class="screen" id="screen1">
    <div class="card">
      <div class="badge">🌟</div>
      <p class="eyebrow">FOR MY FRIEND</p>
      <h1 class="name-en">EMMA</h1>
      <div class="divider"></div>
      <p class="lead">I've got something sweet for you 💌</p>
      <div class="pulse-icon">✨</div>
      <button id="openBtn" class="btn-main">
        <span>🌟 Open your surprise, Emma</span>
      </button>
    </div>
  </section>

  <!-- زر تشغيل الموسيقى: يظهر فقط إذا أضفتي ملف song.mp3 بنفس المجلد -->
  <button id="musicBtn" class="music-btn hidden-music" aria-label="Play music">🎵</button>
  <audio id="bgMusic" src="song.mp3" loop preload="none"></audio>

  <!-- الصفحة الثانية -->
  <section class="screen hidden" id="screen2">
    <div class="card card-letter">
      <div class="badge">💛</div>
      <p class="eyebrow">TO EMMA</p>
      <h1 class="name-ar">Emma</h1>
      <div class="divider"></div>
      <div class="letter" id="letterText"></div>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
